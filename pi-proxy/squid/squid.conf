## Basic network settings
http_port 3128
https_port 3129 tls-cert=/etc/squid/certs/fullchain.pem tls-key=/etc/squid/certs/privkey.pem
#https_port 3129 tls-cert=/etc/squid/certs/fullchain.pem tls-key=/etc/squid/certs/privkey.pem tls-chain=/etc/squid/certs/chain.pem
## Authentication (basic auth via htpasswd file)
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm Proxy Authentication Required
auth_param basic credentialsttl 8 hours

acl authenticated_users proxy_auth REQUIRED

## Access control
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 1025-65535
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow authenticated_users
http_access deny all

## Logging - custom format for easy parsing later
## Fields: timestamp | duration_ms | client_ip | result_code | bytes | method | url | user
logformat custom %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %un

access_log /var/log/squid/access.log custom
cache_log /var/log/squid/cache.log
logfile_rotate 7

## Cache manager (needed later for squid-exporter to query stats)
acl manager url_regex -i ^cache_object://
acl localnet src 172.16.0.0/12
http_access allow manager localnet
http_access deny manager

## Disable disk caching (learning project, not perf-critical)
cache deny all
